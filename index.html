<!-- /index.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>R5900</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <button id="prev" aria-label="Previous">‹</button>
  <select id="pick"></select>
  <button id="next" aria-label="Next">›</button>
  <button id="menuBtn" aria-label="Menu">☰</button>
</header>

<section id="question">
  <h2 id="title"></h2>
  <p id="text"></p>
  <details id="hintBox"><summary>Hint</summary><p id="hint"></p></details>
  <details id="solBox"><summary>Solution</summary><pre id="solution"></pre></details>
</section>

<div id="bar">
  <button id="run">▶ Run</button>
  <div id="result"></div>
</div>

<div id="editor">
  <pre id="gutter">1</pre>
  <textarea id="code" wrap="off" spellcheck="false" autocapitalize="off"
            autocorrect="off" autocomplete="off" placeholder="# your code"></textarea>
</div>

<div id="keybar"></div>

<dialog id="menu">
  <h3>Packs</h3>
  <ul id="packList"></ul>
  <p id="stats"></p>
  <button id="importBtn" class="wide">Import pack / backup (.json)</button>
  <input type="file" id="file" multiple hidden>
  <textarea id="paste" placeholder="…or paste pack JSON here"></textarea>
  <div class="row">
    <button id="addPaste">Add pasted JSON</button>
    <button id="closeMenu">Close</button>
  </div>
  <h3>Progress</h3>
  <div class="row">
    <button id="exportBtn">Export backup</button>
    <button id="resetBtn" class="danger">Reset progress</button>
  </div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
